<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest | Products</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="header"></div>
<main class="container">
  <div class="breadcrumb">Home › Products</div>
  <div class="shop-layout">
    <aside class="filters">
      <h3>Shop by category</h3>
      <label><input type="radio" name="cat" value="All" checked> All</label>
      <label><input type="radio" name="cat" value="Fashion"> Fashion</label>
      <label><input type="radio" name="cat" value="Electronics"> Electronics</label>
      <label><input type="radio" name="cat" value="Home"> Home</label>
      <label><input type="radio" name="cat" value="Beauty"> Beauty</label>
      <hr>
      <h3>Price</h3>
      <label><input type="radio" name="price" value="all" checked> All prices</label>
      <label><input type="radio" name="price" value="low"> Under ₹1,000</label>
      <label><input type="radio" name="price" value="mid"> ₹1,000–₹5,000</label>
      <label><input type="radio" name="price" value="high"> Above ₹5,000</label>
    </aside>
    <section class="results">
      <div class="results-top">
        <div><h1 id="results-title">All Products</h1><span id="results-count"></span></div>
        <select id="sort"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Avg. Customer Review</option></select>
      </div>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </div>
</main>
<div id="footer"></div><script src="script.js"></script>
</body></html>
